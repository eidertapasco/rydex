# ========================================
# CONFIGURACIÓN GENERAL
# ========================================
spring.application.name=rydex
# Railway asigna el puerto automáticamente; en local usa 8080
server.port=${PORT:8080}

# ========================================
# BASE DE DATOS H2 (COMENTADA - DESARROLLO)
# ========================================
# spring.datasource.url=jdbc:h2:mem:rydex_db;DB_CLOSE_DELAY=-1
# spring.datasource.username=sa
# spring.datasource.password=
# spring.datasource.driver-class-name=org.h2.Driver
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# ========================================
# CONFIGURACIÓN MYSQL / MARIADB (ACTIVA)
# ========================================
# Se agregó allowPublicKeyRetrieval=true para corregir el error de conexión
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:rydex_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:22022007}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialecto actualizado para evitar advertencias de deprecación en el log
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ========================================
# JPA / HIBERNATE
# ========================================
# 'update' mantiene los datos en MySQL/MariaDB
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Control de inicialización de datos (H2 usa always, MySQL usa never)
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# ========================================
# JWT (SEGURIDAD)
# ========================================
jwt.secret=rydex-super-secret-key-2024-must-be-at-least-256-bits-long-for-hs256
jwt.expiration=86400000